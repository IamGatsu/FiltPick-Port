# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=1.7.0
group=com.apeng.filtpick
# Minecraft ships Java 25 to end users starting in 26.1, mods must target it too
java_version=25

# Common
minecraft_version=26.2
mod_name=FiltPick
mod_author=A_Peng215
mod_id=filtpick
license=LGPL
credits=
description=Enables you to pick up items selectively.
minecraft_version_range=[26.2, 26.3)

## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
## NOTE: NeoForm's version scheme changed to "<mc version>-<build>" once Mojang dropped
## obfuscation in 26.1 (e.g. "26.1-1"). Grab the current 26.2 build number from the URL above
## before building - it updates often and could not be verified from this sandbox (no network).
neo_form_version=26.2-1

# Fabric version, see https://fabricmc.net/develop/ for new versions
fabric_version=0.155.2+26.2
fabric_loader_version=0.19.3

# NeoForge version, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.2.0.32-beta
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# forge_config_api_port dependency. Check https://modrinth.com/mod/forge-config-api-port/versions for new versions
forge_config_api_port_version=26.2.1

# Inventory Profiles Next library. Check https://modrinth.com/mod/inventory-profiles-next/versions for new versions
## NOTE: verify the exact 26.2 release slug/version on Modrinth before building.
ipn_version=neoforge-26.2-2.3.6